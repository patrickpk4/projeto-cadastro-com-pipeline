prometheus:
  prometheusSpec:
    # permite descobrir ServiceMonitors/PodMonitors de qualquer namespace, sem exigir label do release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    emptyDir: {}
