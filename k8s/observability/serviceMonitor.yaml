ApiVersion: monitoring.coreos.com/v1
Kind: ServiceMonitor
Metadata:
  Name: opentelemetry-service-monitor
  namespace: default
Spec:
  Selector:
    MatchLabels:
      app.kubernetes.io/instance: opentelemetry-collector
      operator.opentelemetry.io/collector-service-type: base
  Endpoints:
    - Port: prometheus
      interval: 30s