name: Smoke test EKS cluster

# Testes reutilizáveis pós-implantação para um cluster EKS existente. O workflow
# chamador informa o nome do cluster; seu Environment fornece AWS_ROLE e REGION.
on:
  workflow_call:
    inputs:
      cluster_name:
        description: Name of the EKS cluster to test
        required: true
        type: string
    secrets:
      # A role precisa permitir consultar o EKS e executar as operações Kubernetes dos testes.
      AWS_ROLE:
        required: true

jobs:
  smoke_test:
    name: Smoke test ${{ inputs.cluster_name }}
    runs-on: ubuntu-latest
    permissions:
      # Usa OIDC em vez de credenciais AWS de longa duração.
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}

      - name: Configure kubeconfig
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          REGION: ${{ vars.REGION }}
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$REGION"
        
        # Confere a disponibilidade da API, os nodes e os workloads essenciais do cluster.
      - name: Check cluster health
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get pods -n kube-system

        # Verifica se o scheduler consegue iniciar réplicas de um workload.
      - name: Test scheduler
        run: |
          kubectl create deployment nginx-deploy \
            --image=nginx:alpine \
            --replicas=2
          kubectl wait \
            --for=condition=Ready \
            pod -l app=nginx-deploy \
            --timeout=120s
          kubectl get pod -l app=nginx-deploy -o wide
        
        # Executa a consulta DNS no próprio pod e aguarda seu término com sucesso.
        # Evita depender da conexão de streaming kubectl exec entre API server e kubelet.
      - name: Test cluster DNS
        run: |
          kubectl run dns-test \
            --image=busybox:1.36 \
            --restart=Never \
            -- nslookup kubernetes.default.svc.cluster.local
          if ! kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/dns-test \
            --timeout=90s; then
            kubectl describe pod dns-test
            exit 1
          fi
        
        # Valida o acesso HTTPS externo a partir de um workload do cluster.
      - name: Test internet egress
        run: |
          kubectl run network-test \
            --image=curlimages/curl \
            --restart=Never \
            -- curl -fsSI --max-time 30 https://www.google.com
          if ! kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/network-test \
            --timeout=90s; then
            kubectl describe pod network-test
            exit 1
          fi
        # Usa namespace dedicado e a NetworkPolicy do manifesto de smoke test.
        # O pod cliente faz a requisição e deve terminar com estado Succeeded.
      - name: Test pod-to-pod communication
        run: |
          kubectl apply -f ./infra/testeEks/nginx.yaml
          kubectl rollout status deployment/nginx -n infra-smoke-tests --timeout=60s

          kubectl run test-pod \
            --namespace=infra-smoke-tests \
            --labels=app=smoke-test-client \
            --image=busybox:1.36 \
            --restart=Never \
            -- wget -q --timeout=10 -O- http://nginx
          if ! kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/test-pod \
            -n infra-smoke-tests \
            --timeout=90s; then
            kubectl describe pod test-pod -n infra-smoke-tests
            exit 1
          fi

      - name: Clean up smoke test resources
        # Remove os workloads temporários mesmo quando alguma etapa anterior falhar.
        if: always()
        run: |
          kubectl delete pod dns-test network-test test-pod --ignore-not-found=true
          kubectl delete deployment nginx-deploy nginx --ignore-not-found=true
          kubectl delete namespace infra-smoke-tests --ignore-not-found=true

      - name: Report run details
        # Registra metadados da execução para diagnóstico e rastreabilidade.
        if: always()
        run: |
          echo "Smoke test completed for cluster: ${{ inputs.cluster_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
