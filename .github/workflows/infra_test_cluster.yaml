name: Test Cluster

on:
  workflow_call:
    

jobs:
  test-cluster:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}  
      - name: configura kubeconfig
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          REGION: ${{ vars.REGION }}
        run: |
          aws eks update-kubeconfig \
           --name "$CLUSTER_NAME" \
           --region "$REGION"
           
      - name: Validar o cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get pods -n kube-system

      - name: teste scheduler 
        run: |
          kubectl create deployment nginx-deploy \
          --image=nginx:alpine \
          --replicas=2
          kubectl wait \
          --for=condition=Ready \
          pod -l app=nginx-deploy \
          --timeout=120s
          kubectl get pod -l app=nginx-deploy -o wide  

      - name: teste de dns 
        run: |
          kubectl run dns-test \
          --image=busybox:1.36 \
          --restart=Never \
          -- sleep 300    
          kubectl exec dns-test -- nslookup kubernetes.default.svc.cluster.local        

      - name: teste saida para internet 
        run: |
          kubectl run network-test \
          --image=curlimages/curl \
          --restart=Never \
          --rm -it \
          -- curl -I https://www.google.com
      - name: checout
        uses: actions/checkout@v4
        with:
          path: ./testeEks

      - name: checkout
        uses: actions/checkout@v4
      
      - name: teste comunicação entre pods 
        run: |
          kubectl apply -f ./testeEks/nginx.yaml
          kubectl rollout status deployment/nginx --timeout=60s
          
          kubectl run test-pod \
            --image=busybox:1.36 \
            --restart=Never \
            -- sleep 300
          
          # Espera o pod ficar Running antes de executar comandos nele
          kubectl wait --for=condition=Ready pod/test-pod --timeout=60s
          
          kubectl exec test-pod -- wget -q --timeout=10 -O- http://nginx

      - name: remover pods do cluster
        run: |
          kubectl delete pod dns-test test-pod 
          kubectl delete deploy nginx-deploy 
          kubectl delete deploy nginx
     
      - name: Mensagem final
        run: |
          echo "========================================"
          echo " Deploy finalizado"
          echo "========================================"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit:     ${{ github.sha }}"
          echo "Autor:      ${{ github.actor }}"
          echo "Repositório: ${{ github.repository }}"
          echo "Run ID:     ${{ github.run_id }}"
          echo "========================================"
          
              
          
          