name: Smoke test EKS cluster

on:
  workflow_call:
    inputs:
      cluster_name:
        description: Name of the EKS cluster to test
        required: true
        type: string
    secrets:
      AWS_ROLE:
        required: true

jobs:
  smoke_test:
    name: Smoke test ${{ inputs.cluster_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}

      - name: Configure kubeconfig
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          REGION: ${{ vars.REGION }}
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$REGION"
        
        # Test cluster health, informaçoes sobre os nodes, pods e namespaces do cluster
      - name: Check cluster health
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get pods -n kube-system

        # Test scheduler, cria um deployment nginx e verifica se os pods estão prontos
      - name: Test scheduler
        run: |
          kubectl create deployment nginx-deploy \
            --image=nginx:alpine \
            --replicas=2
          kubectl wait \
            --for=condition=Ready \
            pod -l app=nginx-deploy \
            --timeout=120s
          kubectl get pod -l app=nginx-deploy -o wide
        
        # Test DNS resolution, cria um pod temporario e verifica se o DNS do cluster está funcionando
      - name: Test cluster DNS
        run: |
          kubectl run dns-test \
            --image=busybox:1.36 \
            --restart=Never \
            -- sleep 300
          kubectl wait --for=condition=Ready pod/dns-test --timeout=60s
          kubectl exec dns-test -- nslookup kubernetes.default.svc.cluster.local
        
        # Test internet egress, cria um pod temporario e verifica se ele consegue acessar a internet
      - name: Test internet egress
        run: |
          kubectl run network-test \
            --image=curlimages/curl \
            --restart=Never \
            --rm -i \
            -- curl -fsSI --max-time 30 https://www.google.com
        # Test pod-to-pod communication, cria um pod nginx e um pod busybox e verifica se o busybox consegue acessar o nginx
      - name: Test pod-to-pod communication
        run: |
          kubectl apply -f ./infra/testeEks/nginx.yaml
          kubectl rollout status deployment/nginx -n infra-smoke-tests --timeout=60s

          kubectl run test-pod \
            --namespace=infra-smoke-tests \
            --labels=app=smoke-test-client \
            --image=busybox:1.36 \
            --restart=Never \
            -- sleep 300
          kubectl wait --for=condition=Ready pod/test-pod -n infra-smoke-tests --timeout=60s
          kubectl exec test-pod -n infra-smoke-tests -- wget -q --timeout=10 -O- http://nginx

      - name: Clean up smoke test resources
        if: always()
        run: |
          kubectl delete pod dns-test test-pod --ignore-not-found=true
          kubectl delete deployment nginx-deploy nginx --ignore-not-found=true
          kubectl delete namespace infra-smoke-tests --ignore-not-found=true

      - name: Report run details
        if: always()
        run: |
          echo "Smoke test completed for cluster: ${{ inputs.cluster_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
