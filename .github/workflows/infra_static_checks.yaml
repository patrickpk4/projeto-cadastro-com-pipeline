name: Terraform static checks

# Executa validações estáticas da infraestrutura em pull requests para main e em
# pushes de feature/hotfix que alterem arquivos de infraestrutura. Não aplica recursos.
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"
      - "hotfix/**"
    paths:
      - "infra/**"
      - ".github/workflows/infra_*.yaml"
      - ".github/workflows/infra_reusable_terraform_plan.yaml"
      - ".github/checkov/**"

permissions:
  # Define leitura de código como permissão padrão; jobs podem declarar permissões
  # adicionais específicas, como publicação de resultados SARIF.
  contents: read

# Mantém apenas a execução mais recente desta verificação por branch.
concurrency:
  group: terraform-static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validate ${{ matrix.stack }} root
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A matriz representa os roots Terraform distintos, não os states:
        # hub usa infra/hub e staging/production compartilham infra/spoke.
        stack: [hub, spoke]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ secrets.TF_VERSION }}

      - name: Initialize without a backend
        # Inicializa providers e módulos sem acessar ou alterar o state remoto.
        working-directory: infra/${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Validate Terraform
        # Verifica a consistência sintática e semântica da configuração inicializada.
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate

  terraform_fmt:
    name: Check Terraform formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ secrets.TF_VERSION }}

      - name: Check formatting
        # Falha se algum arquivo Terraform não seguir a formatação canônica.
        run: terraform fmt -check -recursive infra

  tflint:
    name: TFLint ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Analisa roots e módulos locais que contêm configuração Terraform.
        directory:
          - infra/hub
          - infra/spoke
          - infra/modules/network
          - infra/modules/transit-gateway
          - infra/modules/vpc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: Lint Terraform
        # Executa regras TFLint para detectar problemas e práticas inadequadas.
        run: tflint --chdir="${{ matrix.directory }}" --format=compact

  checkov:
    name: Checkov (${{ matrix.secret_scope }})
    runs-on: ubuntu-latest
    # Hub usa secrets do repositório; spokes selecionam seu Environment para obter
    # TF_VARS isolado por ambiente, sem criar um Environment para o hub.
    environment: ${{ matrix.environment || null }}
    strategy:
      fail-fast: false
      matrix:
        # Mantém uma análise por conjunto de variáveis, inclusive para cada spoke.
        include:
          - secret_scope: hub
            environment: ""
          - secret_scope: staging
            environment: staging
          - secret_scope: production
            environment: production
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write environment variables for Checkov
        # Materializa TF_VARS apenas durante o scan. O conteúdo não é exibido nos logs.
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          if [ -z "$TF_VARS" ]; then
            echo "::error::TF_VARS nao configurado para o scope de segredo ${{ matrix.secret_scope }}"
            exit 1
          fi
          umask 077
          printf '%s' "$TF_VARS" > infra/.checkov.auto.tfvars

      - name: Scan infrastructure
        # O baseline contém exceções aprovadas e específicas; soft_fail=false mantém
        # a análise bloqueante para findings novos que não estejam nesse baseline.
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./infra
          download_external_modules: true
          baseline: ./.github/checkov/infra-baseline.json
          var_file: ./infra/.checkov.auto.tfvars
          soft_fail: false
          output_format: sarif
          output_file_path: results.sarif

      - name: Remove temporary variable file
        # Executa mesmo quando o Checkov falha para não deixar o arquivo no workspace.
        if: always()
        run: rm -f -- infra/.checkov.auto.tfvars

      - name: Upload SARIF results
        # Publica os resultados no Code Scanning com categoria por ambiente para
        # manter os relatórios do hub, staging e production separados.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          token: ${{ secrets.GITHUB_TOKEN }}
          category: checkov-${{ matrix.secret_scope }}
  
  # Verifica o histórico completo do repositório em busca de credenciais expostas.
  gitleaks:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        # O histórico completo permite detectar segredos introduzidos em commits antigos.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect leaked secrets
        # Analisa o repositório sem publicar comentários automáticos no pull request.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
