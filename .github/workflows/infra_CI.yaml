name: Terraform CI

on:
  pull_request:
    branches: [main]

    paths:
      - 'infra/**'

jobs:
  Plan:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}

      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET }}" \
            -backend-config="key=${{ secrets.KEY }}" \
            -backend-config="region=${{ vars.REGION }}"


        # executa o terraform plan e gera o arquivo tfplan
        # a variavel de ambiente tfvars é usada para 
        # passar o arquivo de variaveis do terraform
      - name: Terraform Plan
        working-directory: ./infra
        env:
          tfvars: ${{ secrets.TF_VARS }}
        run: |
          echo "${tfvars}" > terraform.tfvars
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan
        # o arquivo tfplan é gerado e salvo como artefato para ser usado no job de deploy 
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: ./infra/tfplan
          retention-days: 2

  Deploy:
    needs: [Plan]
    uses: ./.github/workflows/infra_CD.yaml
    permissions:
      id-token: write
      contents: read
      security-events: write
    secrets: 
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
      BUCKET: ${{ secrets.BUCKET }}
      KEY: ${{ secrets.KEY }}
      TF_VARS: ${{ secrets.TF_VARS }}
