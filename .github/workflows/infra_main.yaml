name: Infrastructure CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'  
permissions:
  security-events: write      
  actions: read  
  id-token: write  
jobs:
  terraform_test:
    name: Terraform Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate 

      - name: Terraform fmt
        working-directory: ./infra
        run: terraform fmt -check -recursive 
  
  terraform_chekov:
    name: Terraform Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./infra
          download_external_modules: true
          soft_fail: true
          output_format: sarif
          output_file_path: results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          token: ${{ secrets.GITHUB_TOKEN }}

  Build_Plan: 
    name: Build Plan
    needs: [terraform_test, terraform_chekov]
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}      
  
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_NAME }}" \
            -backend-config="key=${{ secrets.BUCKET_KEY }}" \
            -backend-config="region=${{ secrets.REGION }}" \

      
          
      - name: Terraform Plan
        working-directory: ./infra
        env:
          tfvars: ${{ secrets.TFVARS }}
        run: |
          terraform plan out=tfplan:${github_sha} -var-file=$tfvars

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}    
          retention-days: 2


         

              