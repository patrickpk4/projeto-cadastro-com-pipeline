name: App CD Production

on: 
  workflow_call:
    
jobs:
  app_cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get production MongoDB credentials
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,projeto-cadastro/production/mongodb
          parse-json-secrets: true

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.REGION }} \
            --name ${{ vars.CLUSTER_NAME }}

      - name: Create MongoDB Kubernetes Secret
        run: |
          set -euo pipefail
          : "${MONGO_INITDB_ROOT_USERNAME:?Missing MongoDB username in Secrets Manager}"
          : "${MONGO_INITDB_ROOT_PASSWORD:?Missing MongoDB password in Secrets Manager}"
          kubectl create secret generic mongodb-secret \
            --from-literal="MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}" \
            --from-literal="MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}" \
            --dry-run=client \
            --output=yaml |
            kubectl apply --server-side --field-manager=github-actions -f -

      - name: Set ECR image repository in manifest
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          sed -i "s|__ECR_REGISTRY__|${ECR_REGISTRY}|g" \
            k8s/cadastro-k8s/cadastro.yaml

      - uses: Azure/k8s-deploy@v7
        with:
          manifests: |
            k8s/cadastro-k8s/serviceaccount-cadastro.yaml
            k8s/cadastro-k8s/cadastro.yaml
            k8s/cadastro-k8s/configmap.yaml
            k8s/cadastro-k8s/service-cadastro.yaml
            k8s/environments/production/targetgroupbinding.yaml
            k8s/cadastro-k8s/hpa-cadastro.yaml
            k8s/cadastro-k8s/role-cadastro.yaml
            k8s/cadastro-k8s/rolebinding-cadastro.yaml
            k8s/cadastro-k8s/networkpolicy-cadastro.yaml
            k8s/mongodb-k8s/serviceaccount-mongodb.yaml
            k8s/mongodb-k8s/mongodb.yaml
            k8s/mongodb-k8s/service-mongodb.yaml
            k8s/mongodb-k8s/hpa-mongodb.yaml
            k8s/mongodb-k8s/hpa-mongodb.yaml
            k8s/mongodb-k8s/networkpolicy-mongodb.yaml
            k8s/mongodb-k8s/role-mongodb.yaml
            k8s/mongodb-k8s/rolebinding-mongodb.yaml

          images: |
            ${{ steps.ecr-login.outputs.registry }}/catalogo-api:${{ github.sha }}-${{ github.run_attempt }}