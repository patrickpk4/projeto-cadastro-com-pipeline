name: App CD

on: 
  workflow_call:
    
jobs:
  app_cd:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: download docker image
        run: |
          docker pull ghcr.io/${{ github.repository }}/catalogo-api:${{ github.sha }}

      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }} 

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.REGION }} \
            --name ${{ vars.CLUSTER_NAME }}

      - name: Get hub ALB URL
        id: hub-alb
        run: |
          dns_name="$(aws elbv2 describe-load-balancers \
            --names hub-public \
            --query 'LoadBalancers[0].DNSName' \
            --output text)"
          if [ -z "$dns_name" ] || [ "$dns_name" = "None" ]; then
            echo "Could not find the hub ALB DNS name" >&2
            exit 1
          fi
          echo "swagger_url=http://${dns_name}/swagger/index.html" >> "$GITHUB_OUTPUT"
      
      - uses: Azure/k8s-deploy@v7
        with:
          manifests: |
            k8s/cadastro-k8s/serviceaccount-cadastro.yaml
            k8s/cadastro-k8s/cadastro.yaml
            k8s/cadastro-k8s/secret-cadastro.yaml
            k8s/cadastro-k8s/configmap.yaml
            k8s/cadastro-k8s/service-cadastro.yaml
            k8s/environments/staging/targetgroupbinding.yaml
            k8s/cadastro-k8s/hpa-cadastro.yaml
            k8s/cadastro-k8s/role-cadastro.yaml
            k8s/cadastro-k8s/rolebinding-cadastro.yaml
            k8s/cadastro-k8s/networkpolicy-cadastro.yaml
            k8s/mongodb-k8s/serviceaccount-mongodb.yaml
            k8s/mongodb-k8s/mongodb.yaml
            k8s/mongodb-k8s/secret-mongodb.yaml
            k8s/mongodb-k8s/service-mongodb.yaml
            k8s/mongodb-k8s/hpa-mongodb.yaml
            k8s/mongodb-k8s/hpa-mongodb.yaml
            k8s/mongodb-k8s/networkpolicy-mongodb.yaml
            k8s/mongodb-k8s/role-mongodb.yaml
            k8s/mongodb-k8s/rolebinding-mongodb.yaml

          images: |
            ghcr.io/${{ github.repository }}/catalogo-api:${{ github.sha }}

      - name: ZAP Scan - smoke test
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: ${{ steps.hub-alb.outputs.swagger_url }}

  App_cd_prod:
    needs: app_cd
    uses: ./.github/workflows/App_CD_prod.yaml
    permissions:
      contents: read
      id-token: write
      actions: write
    secrets: inherit               

