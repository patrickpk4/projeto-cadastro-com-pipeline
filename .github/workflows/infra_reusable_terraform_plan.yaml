name: Reusable Terraform plan by state

# Implementação compartilhada de planejamento, sem apply, para hub, staging e
# production. Valida os outputs do hub necessários às spokes, salva o plano e
# informa se há mudanças para que os workflows chamadores controlem os applies.
on:
  workflow_call:
    inputs:
      stack_dir:
        description: Terraform root directory relative to the repository
        required: true
        type: string
      state_key:
        description: S3 state key for this stack
        required: true
        type: string
      environment:
        description: Environment do GitHub com secrets específicos; omitido para hub
        required: false
        type: string
      artifact_name:
        description: Plan artifact name
        required: true
        type: string
      uses_hub_state:
        description: Indica se o plano da spoke depende de outputs do state do hub
        required: true
        type: boolean
    secrets:
      # AWS_ROLE e BUCKET devem estar disponíveis no repositório ou no Environment selecionado.
      AWS_ROLE:
        required: true
      BUCKET:
        required: true
      TF_VERSION:
        required: true
      TF_VARS:
        required: false
    outputs:
      has_changes:
        description: Whether the plan contains changes
        value: ${{ jobs.plan.outputs.has_changes }}

jobs:
  plan:
    runs-on: ubuntu-latest
    # Sem Environment, o hub usa secrets do repositório. Staging e production
    # selecionam seus respectivos Environments e secrets específicos.
    environment: ${{ inputs.environment || null }}
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Normalize S3 bucket secret
        # Remove espaços acidentais no início/fim e rejeita entradas inválidas.
        env:
          BUCKET_SECRET: ${{ secrets.BUCKET }}
        shell: bash
        run: |
          bucket="$(printf '%s' "$BUCKET_SECRET" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$bucket" ]]; then
            echo "::error::The BUCKET secret is empty after trimming whitespace"
            exit 1
          fi
          if [[ "$bucket" =~ [[:space:]] ]]; then
            echo "::error::The BUCKET secret contains internal whitespace"
            exit 1
          fi
          if [[ "$bucket" != "$BUCKET_SECRET" ]]; then
            echo "::warning::The BUCKET secret has surrounding whitespace; trimming it for this run"
          fi
          echo "::add-mask::$bucket"
          printf 'BUCKET=%s\n' "$bucket" >> "$GITHUB_ENV"

      - name: Set up Terraform
        # Desativa o wrapper para preservar os códigos detalhados do Terraform (0 e 2).
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ secrets.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}

        # O plano da spoke depende dos outputs aplicados pelo hub. Só ignora a etapa
        # quando o state não existe ou está incompleto; erros de acesso/serviço falham.
      - name: Check hub state outputs
        id: hub_state
        if: inputs.uses_hub_state
        shell: bash
        run: |
          error_file="$RUNNER_TEMP/hub-state-error.txt"
          state_file="$RUNNER_TEMP/hub-state.json"

          if aws s3api head-object \
            --bucket "$BUCKET" \
            --key "hub/terraform.tfstate" >/dev/null 2>"$error_file"; then
            aws s3api get-object \
              --bucket "$BUCKET" \
              --key "hub/terraform.tfstate" \
              "$state_file" >/dev/null
            if jq -e '
              .outputs.transit_gateway_id.value != null and
              .outputs.hub_attachment_id.value != null and
              .outputs.hub_route_table_id.value != null and
              .outputs.hub_public_route_table_id.value != null and
              .outputs.hub_load_balancer_security_group_id.value != null and
              .outputs.hub_load_balancer_dns_name.value != null
            ' "$state_file" >/dev/null; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Spoke plan skipped: the hub state does not contain all required outputs." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            result=$?
            if grep -Eq '404|NoSuchKey|Not Found' "$error_file"; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Spoke plan skipped: apply the hub before planning a spoke." >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$error_file" >&2
              exit "$result"
            fi
          fi

      - name: Initialize state backend
        # Reconfigura o backend para a chave de state independente desta stack.
        working-directory: ${{ inputs.stack_dir }}
        env:
          STATE_KEY: ${{ inputs.state_key }}
          REGION: ${{ vars.REGION }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=$REGION"

      - name: Create Terraform plan
        id: plan
        # O Terraform carrega automaticamente o arquivo terraform.tfvars gerado.
        # O trap remove o arquivo derivado do secret, com sucesso ou falha do plano.
        if: inputs.uses_hub_state == false || steps.hub_state.outputs.ready == 'true'
        working-directory: ${{ inputs.stack_dir }}
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
          USES_HUB_STATE: ${{ inputs.uses_hub_state }}
          SECRET_SCOPE: ${{ inputs.environment || 'repository' }}
        shell: bash
        run: |
          if [[ -z "$TF_VARS" ]]; then
            echo "::error::TF_VARS is not configured for the $SECRET_SCOPE secret scope"
            exit 1
          fi

          vars_file="terraform.tfvars"
          trap 'rm -f -- "$vars_file"' EXIT
          umask 077
          printf '%s' "$TF_VARS" > "$vars_file"

          if [[ "$USES_HUB_STATE" == "true" ]]; then
            export TF_VAR_state_bucket="$BUCKET"
          fi

          set +e
          terraform plan -detailed-exitcode \
            -out=tfplan
          result=$?
          set -e

          case "$result" in
            0)
              # Código detalhado 0 indica que o state já corresponde à configuração.
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "Nao ha mudancas."
              ;;
            2)
              # Código detalhado 2 indica mudanças; preserve e publique este plano.
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              terraform show -no-color tfplan > plan.txt
              cat plan.txt >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit "$result"
              ;;
          esac

      - name: Upload saved plan
        # Só publica planos com mudanças. O apply baixa este artefato específico do
        # commit; a retenção é curta porque o plano pode conter dados da infraestrutura.
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ inputs.stack_dir }}/tfplan
            ${{ inputs.stack_dir }}/plan.txt
          retention-days: 2
