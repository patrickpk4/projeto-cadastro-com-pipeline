name: Test Cluster

on:
  workflow_call:
    

jobs:
  test-cluster:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}  
      - name: configura kubeconfig
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          REGION: ${{ vars.REGION }}
        run: |
          aws eks update-kubeconfig \
           --name "$CLUSTER_NAME" \
           --region "$REGION"
           
      - name: Validar o cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get pods -n kube-system

      - name: teste scheduler 
        run: |
          kubectl create deployment nginx-deploy \
          --image=nginx:alpine \
          --replicas=2
          kubectl wait \
          --for=condition=Ready \
          pod -l app=nginx-deploy \
          --timeout=120s
          kubectl get pod -l app=nginx-deploy -o wide  

      - name: teste de dns 
        run: |
          kubectl run dns-test \
          --image=busybox:1.36 \
          --restart=Never \
          -- sleep 300    
          kubectl exec dns-test -- nslookup kubernetes.default.svc.cluster.local        

      - name: teste saida para internet 
        run: |
          kubectl run network-test \
          --image=curlimages/curl \
          --restart=Never \
          --rm -it \
          -- curl -I https://www.google.com
      - name: checout
        uses: actions/checkout@v4
        with:
          path: ./testeEks

      - name: checkout
        uses: actions/checkout@v4
      
      - name: teste comunicação entre pods 
        run: |
          kubectl apply -f ./testeEks/nginx.yaml

          # Espera o Deployment estar disponível antes de testar
          kubectl rollout status deployment/nginx --timeout=120s
          
          kubectl run test-pod \
            --image=busybox:1.36 \
            --restart=Never \
            -- sleep 300
          
          # Espera o pod ficar Running antes de executar comandos nele
          kubectl wait --for=condition=Ready pod/test-pod --timeout=60s
          
          kubectl exec test-pod -- wget -q --timeout=10 -O- http://nginx
          
          kubectl run test-pod1 \
            --image=busybox:1.36 \
            --restart=Never \
            -- sleep 300
          kubectl wait --for=condition=Ready pod/test-pod1 --timeout=60s
          
          # Espera o LoadBalancer receber IP externo (isso pode levar alguns MINUTOS na AWS)
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl get svc nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$EXTERNAL_IP" ]; then
              break
            fi
            echo "Aguardando IP do LoadBalancer... ($i)"
            sleep 10
          done
          
          if [ -z "$EXTERNAL_IP" ]; then
            echo "LoadBalancer não recebeu IP a tempo"
            exit 1
          fi
          
          echo "IP externo: $EXTERNAL_IP"
          kubectl exec test-pod1 -- wget -q --timeout=10 -O- http://$EXTERNAL_IP