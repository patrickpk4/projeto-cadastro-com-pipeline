name: Test Cluster

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      

jobs:
  test-cluster:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}  
      - name: configura kubeconfig
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          REGION: ${{ vars.REGION }}
        run: |
          printf 'CLUSTER_NAME=%q\n' "$CLUSTER_NAME"
          if [[ ! "$CLUSTER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "::error::CLUSTER_NAME contém caracteres inválidos"
            exit 1
          fi
          aws eks update-kubeconfig \
           --name "$CLUSTER_NAME" \
           --region "$REGION"
           
      - name: Test Cluster
        run: |
          kubectl get nodes    