name: App CI

on:
  workflow_call:



jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/PedeLogo.Catalogo.Api/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/catalogo-api:${{ github.sha }}-${{ github.run_attempt }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/catalogo-api:${{ github.sha }}-${{ github.run_attempt }}
          format: 'table'
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: 'os,library'
          exit-code: '1'

  App_cd:
    needs: build
    uses: ./.github/workflows/App_CD.yaml
    permissions:
      contents: read
      id-token: write
      actions: write
      issues: write
    secrets: 
       AWS_ROLE: ${{ secrets.AWS_ROLE }}
                  

      


      