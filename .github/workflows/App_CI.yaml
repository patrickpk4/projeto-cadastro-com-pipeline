name: App CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build
        run: | 
          docker build \
          -t ghcr.io/${{ github.repository }}/catalogo-api:${{ github.sha }} \
          -t ghcr.io/${{ github.repository }}/catalogo-api:latest \
           ./src/PedeLogo.Catalogo.Api    
          retention-days: 2

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/catalogo-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'      

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/catalogo-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/catalogo-api:latest     

      


      